name: update data

# Daily: pull new nginx.org advisories, CVE ratings and releases, test, and commit only if
# something changed. If a source looks wrong the updater stops and this run fails, so bad
# data is never published.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Refresh from nginx.org, CVE records and nginx releases
        run: python tools/update_data.py
      - name: Test before publishing
        run: python -m unittest discover -s . -p "test_*.py"
      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain -- nginxwatch/data)" ]; then
            echo "Data already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nginxwatch/data
          git commit -m "Data: $(head -c 900 .data-changes.txt)"
          git push
